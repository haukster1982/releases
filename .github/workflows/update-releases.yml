name: Update Heavy Metal Talks Releases

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-releases:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape HeavyMetalBest
        run: python 01_scrape_hmb.py

      - name: Apply genre database and overrides
        run: python 02_apply_genre_database.py

      - name: Build Blogger HTML
        run: python 03_build_blogger_html.py

      - name: Update Blogger page
        run: python 04_update_blogger_page.py
        env:
          BLOG_ID:                    ${{ secrets.BLOG_ID }}
          PAGE_ID:                    ${{ secrets.PAGE_ID }}
          BLOGGER_CLIENT_SECRET_JSON: ${{ secrets.BLOGGER_CLIENT_SECRET_JSON }}
          BLOGGER_TOKEN_JSON:         ${{ secrets.BLOGGER_TOKEN_JSON }}

      - name: Commit updated data files
        run: |
          git config user.email "heavymetaltalks@gmail.com"
          git config user.name "Heavy Metal Talks Bot"
          git add data/hmb_arkiv.json data/hmb_export.csv data/hmb_with_genres.csv data/unresolved_genres.csv || true
          git diff --staged --quiet || git commit -m "Auto: oppdater album og sjanger $(date +%Y-%m-%d)"
          git push || true
