name: Update Heavy Metal Talks Releases

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  update-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 google-auth google-auth-oauthlib google-api-python-client

      - name: Write credentials
        run: |
          echo '${{ secrets.CLIENT_SECRET }}' > client_secret.json
          echo '${{ secrets.TOKEN_PICKLE_B64 }}' | base64 -d > token.pickle

      - name: Scrape HeavyMetalBest
        run: python 01_scrape_hmb.py

      - name: Apply genre database and overrides
        run: python 02_apply_genre_database.py

      - name: Build Blogger HTML
        run: python 03_build_blogger_html.py

      - name: Update Blogger page
        run: python 04_update_blogger_page.py

      - name: Commit updated data files
        run: |
          git config user.email "heavymetaltalks@gmail.com"
          git config user.name "haukster1982"
          git add -f data/hmb_arkiv.json data/hmb_export.csv data/hmb_with_genres.csv data/unresolved_genres.csv || true
          git diff --staged --quiet || git commit -m "Auto: oppdater album og sjanger $(date +%Y-%m-%d)"
          git push || true
